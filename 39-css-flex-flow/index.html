<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành CSS flex-flow</title>
    <!-- Liên kết tệp CSS cùng thư mục -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính CSS flex-flow (Shorthand)</h2>

    <!-- Ví dụ 1: flex-flow: row nowrap -->
    <section class="example-section">
        <h3>1. Ví dụ 1: <code>flex-flow: row nowrap;</code> (Sắp xếp theo chiều ngang, không xuống dòng)</h3>
        <div class="container container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

    <!-- Ví dụ 2: flex-flow: row-reverse nowrap -->
    <section class="example-section">
        <h3>2. Ví dụ 2: <code>flex-flow: row-reverse nowrap;</code> (Đảo ngược hướng ngang, không xuống dòng)</h3>
        <div class="container container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

</body>
</html>
