<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký - Bootstrap 5</title>
    <!-- Nhúng CSS Bootstrap 5.3 từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Tệp CSS tùy chỉnh -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-12">
                <!-- Thẻ Card chứa Form Đăng Ký -->
                <div class="card border-0 shadow-lg p-4 rounded-4">
                    <div class="card-body">
                        
                        <!-- Tiêu đề Form -->
                        <h2 class="text-center text-primary fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4 small">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản</p>

                        <form action="#" method="POST">
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-medium">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" placeholder="nguyenvana@gmail.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn cho bất kỳ ai.</div>
                            </div>

                            <!-- 3. Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-medium">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio button) -->
                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-medium">Quốc gia</label>
                                <select class="form-select" id="country">
                                    <option value="vn" selected>Việt Nam</option>
                                    <option value="us">Mỹ (United States)</option>
                                    <option value="jp">Nhật Bản</option>
                                    <option value="kr">Hàn Quốc</option>
                                    <option value="other">Khác</option>
                                </select>
                            </div>

                            <!-- 8. Nút Submit -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Đăng Ký Ngay</button>
                            </div>

                            <p class="text-center text-muted mt-3 mb-0 small">
                                Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-bold">Đăng nhập</a>
                            </p>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5.3 JavaScript Bundle từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
