<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành grid-template-columns</title>
    <!-- Liên kết tệp CSS cùng thư mục -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính CSS grid-template-columns</h2>

    <!-- Ví dụ 1: Tạo 3 cột có kích thước bằng nhau (1fr 1fr 1fr) -->
    <section class="example-section">
        <h3>Ví dụ 1: 3 Cột Kích Thước Bằng Nhau (1fr 1fr 1fr)</h3>
        <div class="grid-container-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>

    <!-- Ví dụ 2: Tạo các cột có kích thước khác nhau (100px 200px 1fr) -->
    <section class="example-section">
        <h3>Ví dụ 2: Các Cột Kích Thước Khác Nhau (100px 200px 1fr)</h3>
        <div class="grid-container-2">
            <div>Cột 1 (100px)</div>
            <div>Cột 2 (200px)</div>
            <div>Cột 3 (1fr còn lại)</div>
            <div>Cột 1 (100px)</div>
            <div>Cột 2 (200px)</div>
            <div>Cột 3 (1fr còn lại)</div>
        </div>
    </section>

</body>
</html>
