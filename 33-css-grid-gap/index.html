<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành grid-gap</title>
    <!-- Liên kết tệp CSS cùng thư mục -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính CSS grid-gap (hoặc gap)</h2>

    <!-- Ví dụ 1: Khoảng cách giữa hàng và cột bằng nhau (20px) -->
    <section class="example-section">
        <h3>Ví dụ 1: Khoảng cách Hàng & Cột bằng nhau <code>grid-gap: 20px;</code></h3>
        <div class="grid-container grid-equal">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <!-- Ví dụ 2: Khoảng cách giữa hàng và cột khác nhau (Hàng 30px, Cột 10px) -->
    <section class="example-section">
        <h3>Ví dụ 2: Khoảng cách Hàng 30px, Cột 10px <code>grid-gap: 30px 10px;</code></h3>
        <div class="grid-container grid-different">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>

</body>
</html>
