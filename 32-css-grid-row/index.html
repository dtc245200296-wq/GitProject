<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành Grid Row</title>
    <!-- Liên kết tệp CSS cùng thư mục -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính CSS grid-row</h2>
    <p class="guide">Quan sát Ô 1 thay đổi vị trí và độ cao khi thay đổi thuộc tính <code>grid-row</code> trong file style.css</p>

    <!-- Khung chứa lưới 3 cột x 3 hàng -->
    <div class="grid-container">
        <div class="item item1">Ô 1 (grid-row: 1 / 3)</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

</body>
</html>
