<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <!-- Liên kết CSS và JavaScript -->
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Thanh điều hướng Navbar -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        
        <!-- Danh sách menu -->
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>

        <!-- Nút biểu tượng Hamburger Menu cho giao diện mobile -->
        <div class="menu-icon">☰</div>
    </nav>

    <!-- Nội dung mẫu kiểm tra hiển thị -->
    <main style="padding: 30px; text-align: center;">
        <h2>Thực Hành Tạo Responsive Navbar</h2>
        <p>Thu nhỏ trình duyệt hoặc bật chế độ Responsive để kiểm tra menu ☰ trên điện thoại.</p>
    </main>

</body>
</html>
