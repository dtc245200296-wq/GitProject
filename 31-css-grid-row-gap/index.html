<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Hành grid-row-gap</title>
    <!-- Liên kết tệp CSS cùng thư mục -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực Hành Thuộc Tính CSS grid-row-gap</h2>

    <!-- Ví dụ 1: Giá trị Length (20px) -->
    <section class="example-section">
        <h3>Ví dụ 1: Độ dài cố định <code>grid-row-gap: 20px;</code></h3>
        <div class="grid-container grid-length">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <!-- Ví dụ 2: Giá trị Percentage (5%) -->
    <section class="example-section">
        <h3>Ví dụ 2: Tỷ lệ phần trăm <code>grid-row-gap: 5%;</code> (Height: 400px)</h3>
        <div class="grid-container grid-percent">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <!-- Ví dụ 3: Cú pháp CSS hiện đại row-gap & Global Values -->
    <section class="example-section">
        <h3>Ví dụ 3: CSS Hiện đại <code>row-gap: 30px;</code></h3>
        <div class="grid-container grid-modern">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

</body>
</html>
